[project]
name = "perceptron-lab"
version = "0.1.0"
description = "Однослойный перцептрон для классификации (лабораторная 1)"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.package-data]
perceptron_lab = ["data/*.csv"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]